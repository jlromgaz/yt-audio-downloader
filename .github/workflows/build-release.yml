name: Build & Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

# Default to read-only; the release job explicitly elevates to
# contents: write, which is the only step that needs to publish anything.
permissions:
  contents: read

jobs:
  # Runs on every push/PR: fast unit-test gate, no network, no packaging.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tk (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      # Confirmed via a real CI run: none of the three hosted runner images
      # ship ffmpeg preinstalled — install it explicitly on all of them.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests (no network)
        # core.downloader.download() resolves ffmpeg eagerly (fails fast if
        # missing) even for tests using a fake yt-dlp client, so ffmpeg must
        # be on PATH here — not just in the build-release job's vendor fetch.
        run: pytest -m "not integration"

  # Tags are not scoped to a branch in git, so a `push: tags:` trigger fires
  # regardless of which branch the tagged commit lives on. This job fails
  # fast (before any build minutes are spent) unless the tagged commit is
  # actually reachable from main — releases are only allowed from main.
  verify-tag-on-main:
    name: Verify tag is on main
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require tag to point at a commit reachable from main
        run: |
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${{ github.ref_name }} (commit $GITHUB_SHA) is not on main. Releases are only allowed from main."
            exit 1
          fi

  # Runs only on tag push (v*): builds a per-OS onefile binary, runs the
  # verify_e2e.py smoke gate (network + tk available in CI), and uploads
  # artifacts. A release is only published once all matrix legs pass.
  build-release:
    name: build (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, verify-tag-on-main]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tk (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Fetch vendored ffmpeg + deno
        run: python scripts/fetch_vendor.py

      - name: Build with PyInstaller
        run: pyinstaller app.spec

      # A real YouTube download is deliberately NOT gating CI: GitHub-hosted
      # runners share well-known datacenter IP ranges that YouTube's
      # anti-bot detection blocks ("Sign in to confirm you're not a bot"),
      # independent of whether the code is correct. Confirmed via a real
      # release run — all 3 OS legs failed identically. This gate is run
      # manually in development instead (verified working on a residential
      # IP as part of this project's history).

      - name: E2E smoke gate — frozen binary launch check (Linux/macOS)
        if: runner.os != 'Windows'
        run: python scripts/verify_e2e.py --binary dist/YouTubeAudioDownloader

      - name: E2E smoke gate — frozen binary launch check (Windows)
        if: runner.os == 'Windows'
        run: python scripts/verify_e2e.py --binary dist/YouTubeAudioDownloader.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeAudioDownloader-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create release with all OS artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          draft: false
          generate_release_notes: true
